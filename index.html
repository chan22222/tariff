<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>요율 조회</title>
<style>
:root{--bg:#f5f7fa;--card:#fff;--ink:#1f2937;--muted:#6b7280;--line:#e5e7eb;--navy:#1F3864;--soft:#eef2f9;--hi:#fff7d6;--warn:#b45309}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Malgun Gothic","Apple SD Gothic Neo",Arial,sans-serif;font-size:14px}
.wrap{max-width:1100px;margin:0 auto;padding:24px 16px 48px}
h1{margin:0 0 4px;font-size:22px;color:var(--navy)}
.sub{color:var(--muted);font-size:12px;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:16px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;align-items:end}
label{display:block;font-weight:bold;margin-bottom:6px}
label small{font-weight:normal;color:var(--muted)}
input{width:100%;padding:10px 12px;font-size:16px;border:1px solid #cbd5e1;border-radius:8px;text-transform:uppercase;font-family:inherit}
input:focus{outline:2px solid #93c5fd;border-color:#60a5fa}
.resolved{font-size:13px;color:var(--muted);margin-top:12px;line-height:1.6}
.resolved b{color:var(--ink)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{background:var(--navy);color:#fff;padding:8px 6px;font-weight:bold;white-space:nowrap}
.tbl td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:right;white-space:nowrap}
.tbl td.l{text-align:left;white-space:normal}
.tbl tr.main td{background:var(--hi);font-weight:bold}
.tbl tr.iata td{background:var(--soft)}
.scroll{overflow-x:auto}
h2{font-size:15px;margin:0 0 10px;color:var(--navy)}
.note{color:var(--warn);font-size:12px}
.empty{color:var(--muted);padding:10px 0}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:4px;background:#e0e7ff;color:#3730a3;margin-left:4px;font-weight:normal}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
datalist{display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>요율 조회</h1>
  <div class="sub">From Seoul 태리프 (KRW) · 원본 TARIFF.xlsx (2026-10-26 기준) · 오프라인에서도 동작</div>

  <div class="card">
    <div class="form">
      <div>
        <label for="al">항공사 <small>2자리 코드 (예: CX, KE, LH)</small></label>
        <input id="al" maxlength="3" value="CX" autocomplete="off">
      </div>
      <div>
        <label for="ds">도착지 코드 <small>공항(MXP, JFK…) 또는 도시(MIL, NYC…)</small></label>
        <input id="ds" maxlength="3" value="SYD" list="apList" autocomplete="off">
        <datalist id="apList"></datalist>
      </div>
    </div>
    <div class="resolved" id="resolved"></div>
  </div>

  <div class="card">
    <h2>조회 결과</h2>
    <div class="scroll">
      <table class="tbl">
        <thead><tr><th>구분</th><th>도시</th><th>국가-지역</th><th>항공사(표기)</th><th>M(최저)</th><th>N(-45)</th><th>+45</th><th>+100</th><th>+300</th><th>+500</th><th>+1,000</th></tr></thead>
        <tbody id="main"></tbody>
      </table>
    </div>
  </div>

  <div class="card">
    <h2>이 도착지의 전체 항공사 요율 <span id="cnt" class="tag"></span></h2>
    <div class="scroll">
      <table class="tbl">
        <thead><tr><th>항공사</th><th>Item / 비고</th><th>M(최저)</th><th>N(-45)</th><th>+45</th><th>+100</th><th>+300</th><th>+500</th><th>+1,000</th></tr></thead>
        <tbody id="all"></tbody>
      </table>
    </div>
    <div class="hint">노란색 = 입력한 항공사 행, 파란색 = IATA 공시</div>
  </div>
</div>

const AP=new Map(AIRPORTS.map(a=>[a[0],a]));
const BY=new Map();
TARIFF.forEach(r=>{ if(!BY.has(r[1])) BY.set(r[1],[]); BY.get(r[1]).push(r); });

// 엑셀 _key 시트와 같은 규칙: 항공사 칸을 ",KE,CX," 형태로 바꿔서 매칭. 항공사가 없거나 Item 행은 키 없음.
function carriers(r){ if(!r[3]||r[4]) return null; return ','+(r[3]==='IATA 공시'?'IATA':r[3].toUpperCase().replace(/\s+/g,''))+','; }

const fmt=v=>{ if(v===''||v==null) return '-'; const n=Number(v); return isNaN(n)?v:n.toLocaleString('ko-KR'); };

function resolve(code){
  const a=AP.get(code);
  if(a && a[4]) return {tc:a[4], ap:a};
  return {tc:code, ap:a||null};
}

function rowHtml(label,r,cls){
  if(!r) return `<tr class="${cls}"><td class="l">${label}</td><td class="l" colspan="10">(없음)</td></tr>`;
  return `<tr class="${cls}"><td class="l">${label}</td><td class="l">${r[0]}</td><td class="l">${r[2]}</td><td class="l">${r[3]}</td>`+
    [5,6,7,8,9,10,11].map(i=>`<td>${fmt(r[i])}</td>`).join('')+'</tr>';
}

function run(){
  const al=document.getElementById('al').value.trim().toUpperCase();
  const ds=document.getElementById('ds').value.trim().toUpperCase();
  const res=document.getElementById('resolved'), main=document.getElementById('main'), all=document.getElementById('all');
  if(ds.length<3){ res.innerHTML=''; main.innerHTML=''; all.innerHTML=''; document.getElementById('cnt').textContent=''; return; }
  const {tc,ap}=resolve(ds);
  const rows=BY.get(tc)||[];
  res.innerHTML=`태리프 코드: <b>${tc}</b>`+(ap?` &nbsp;·&nbsp; ${ap[1]} (${ap[2]})${ap[3]?' · '+ap[3]:''}`:'')+
    (tc!==ds?` <span class="note">← ${ds}는 도시코드 ${tc}로 조회</span>`:'')+
    (!rows.length?`<div class="note">태리프에 ${tc} 도착지가 없습니다.</div>`:'');

  const hit=al?rows.find(r=>{const k=carriers(r); return k && k.includes(','+al+',');}):null;
  const iata=rows.find(r=>carriers(r)===',IATA,');
  main.innerHTML=rowHtml('항공사 요율',hit,'main')+rowHtml('IATA 공시',iata,'iata');

  document.getElementById('cnt').textContent=rows.length?rows.length+'행':'';
  all.innerHTML=rows.length?rows.map(r=>{
    const cls=r===hit?'main':(carriers(r)===',IATA,'?'iata':'');
    return `<tr class="${cls}"><td class="l">${r[3]||'-'}</td><td class="l">${r[4]}</td>`+[5,6,7,8,9,10,11].map(i=>`<td>${fmt(r[i])}</td>`).join('')+'</tr>';
  }).join(''):'<tr><td class="l empty" colspan="9">요율 없음</td></tr>';
}

// 도착지 자동완성: 태리프에 있는 코드 + 공항코드
(function(){
  const dl=document.getElementById('apList'); const seen=new Set(); const opts=[];
  TARIFF.forEach(r=>{ if(!seen.has(r[1])){ seen.add(r[1]); opts.push(`<option value="${r[1]}">${r[0]}</option>`);} });
  AIRPORTS.forEach(a=>{ if(!seen.has(a[0])){ seen.add(a[0]); opts.push(`<option value="${a[0]}">${a[1]} ${a[2]}</option>`);} });
  dl.innerHTML=opts.join('');
})();

['al','ds'].forEach(id=>document.getElementById(id).addEventListener('input',run));
run();
</script>
